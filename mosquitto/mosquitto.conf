listener 1883
# MQTT over WebSockets, reached from outside through Traefik at /mqtt
listener 8884
protocol websockets
allow_anonymous false
# written at startup from MQTT_USERNAME and MQTT_PASSWORD (docker-compose.yml)
password_file /mosquitto/passwd
# also written at startup: MQTT_USERNAME may do anything, everyone/everyone may
# only subscribe to origin/a/wigos/#
acl_file /mosquitto/acl
# the health check connects every 5 s
connection_messages false
